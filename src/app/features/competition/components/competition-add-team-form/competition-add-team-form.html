<form class="rounded-xl border border-slate-200 bg-white p-4" (submit)="enrollTeam($event)">
	<label for="team-to-enroll" class="mb-1.5 block text-sm font-semibold text-slate-700">Ajouter une équipe</label>
	<div class="flex flex-col gap-3 sm:flex-row sm:items-stretch">
		<select
			id="team-to-enroll"
			[value]="selectedTeamId()"
			(change)="onTeamChange($event)"
			[disabled]="teamsResource.isLoading() || availableTeams().length === 0 || isFull()"
			class="min-h-11 min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 disabled:cursor-not-allowed disabled:bg-slate-100"
		>
			<option value="">Choisir une équipe</option>
			@for (team of availableTeams(); track team.id) {
				<option [value]="team.id">{{ team.name }} ({{ team.countryCode }})</option>
			}
		</select>

		<button
			type="submit"
			[disabled]="!selectedTeamId() || enrollLoading() || isFull()"
			class="min-h-11 w-full shrink-0 whitespace-nowrap rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:bg-slate-300 sm:w-44"
		>
			{{ enrollLoading() ? 'Inscription…' : 'Inscrire l’équipe' }}
		</button>
	</div>

	<div class="mt-2 space-y-1" aria-live="polite">
		@if (teamsResource.isLoading()) {
			<p class="text-xs text-slate-500">Chargement des équipes compatibles…</p>
		} @else if (availableTeams().length === 0 && !isFull()) {
			<p class="text-xs text-slate-500">Aucune équipe compatible disponible.</p>
		}
		@if (enrollError()) {
			<p role="alert" class="text-sm text-red-700">{{ enrollError() }}</p>
		}
	</div>
</form>
