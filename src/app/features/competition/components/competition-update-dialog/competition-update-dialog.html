
<!-- Main modal -->
<div tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6">
            <!-- Modal header -->
            <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                <h3 class="text-lg font-medium text-heading">
                    Modification de compétition
                </h3>
                <button type="button" class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center" data-modal-hide="static-modal" 
                    (click)="closeDialog()">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="space-y-4 md:space-y-6 py-4 md:py-6">
                <p class="text-xs text-indigo-100 mt-1">Remplissez les champs ci-dessous pour éditer une compétition</p>
        <form [formRoot]="competitionForm" class="p-6 space-y-5" novalidate>
            @if (error()) {
                <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
                {{ error() }}
                </div>
            }

            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-1.5">Nom de la compétition</label>
                <input
                id="name"
                type="text"
                [formField]="competitionForm.name"
                [class.border-red-500]="competitionForm.name().dirty() && competitionForm.name().errors().length > 0"
                [class.bg-red-50]="competitionForm.name().dirty() && competitionForm.name().errors().length > 0"
                [attr.aria-invalid]="competitionForm.name().dirty() && competitionForm.name().errors().length > 0"
                class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                placeholder="Coupe du monde"
                />
                @if (competitionForm.name().dirty()) {
                    @for (error of competitionForm.name().errors(); track error) {
                        <p class="text-xs text-red-500 font-medium">{{ error.message }}</p>
                    }
                }
            </div>

            <div class="grid gap-5 md:grid-cols-2">
                <div>
                <label for="country" class="block text-sm font-semibold text-gray-700 mb-1.5">Pays</label>
                <select
                    id="country"
                    [formField]="competitionForm.countryCode"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                >
                        <option selected>Choisir un pays</option>
                        <option value="" > Aucun </option>
                        @for (country of countries; track country.code) {
                            <option [value]="country.code">{{country.label}}</option>
                        }
                </select>
                </div>

                <div>
                <label for="teams-count" class="block text-sm font-semibold text-gray-700 mb-1.5">Nombre d'équipes</label>
                <input
                    id="teams-count"
                    type="number"
                    [formField]="competitionForm.numberOfTeams"
                    [class.border-red-500]="competitionForm.numberOfTeams().dirty() && competitionForm.numberOfTeams().errors().length > 0"
                    [class.bg-red-50]="competitionForm.numberOfTeams().dirty() && competitionForm.numberOfTeams().errors().length > 0"
                    [attr.aria-invalid]="competitionForm.numberOfTeams().dirty() && competitionForm.numberOfTeams().errors().length > 0"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                    placeholder="16"
                />
                </div>

                <div>
                <label for="participant-kind" class="block text-sm font-semibold text-gray-700 mb-1.5">Type de d'équipes</label>
                <select
                    id="participant-kind"
                    [formField]="competitionForm.participantKind"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                >
                    <option value="">Choisir le type d' équipes</option>
                    @for (item of participantKinds; track item.value) {
                    <option [value]="item.value">{{ item.label }}</option>
                    }
                </select>
                </div>

                <div>
                <label for="scope" class="block text-sm font-semibold text-gray-700 mb-1.5">Portée de la compétition</label>
                <select
                    id="scope"
                    [formField]="competitionForm.scope"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                >
                    <option value="">Choisir la portée</option>
                    @for (item of competitionScopes; track item.value) {
                    <option [value]="item.value">{{ item.label }}</option>
                    }
                </select>
                </div>

                <div>
                <label for="type" class="block text-sm font-semibold text-gray-700 mb-1.5">Type de compétition</label>
                <select
                    id="type"
                    [formField]="competitionForm.type"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                >
                    <option value="">Choisir le type</option>
                    @for (item of competitionTypes; track item.value) {
                    <option [value]="item.value">{{ item.label }}</option>
                    }
                </select>
                </div>

                <div>
                <label for="phase" class="block text-sm font-semibold text-gray-700 mb-1.5">Phase</label>
                <select
                    id="phase"
                    [formField]="competitionForm.phase"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                >
                    <option value="">Aucune</option>
                    @for (item of competitionPhases; track item.value) {
                    <option [value]="item.value">{{ item.label }}</option>
                    }
                </select>
                </div>

                <div>
                <label for="player-sex" class="block text-sm font-semibold text-gray-700 mb-1.5">Sexe</label>
                <select
                    id="player-sex"
                    [formField]="competitionForm.playerSex"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                >
                    @for (item of playerSexes; track item.value) {
                    <option [value]="item.value">{{ item.label }}</option>
                    }
                </select>
                </div>

                <div>
                <label for="start-datetime" class="block text-sm font-semibold text-gray-700 mb-1.5">Date de début</label>
                <input
                    id="start-datetime"
                    type="datetime-local"
                    [formField]="competitionForm.startDatetime"
                    [class.border-red-500]="competitionForm.startDatetime().dirty() && competitionForm.startDatetime().errors().length > 0"
                    [class.bg-red-50]="competitionForm.startDatetime().dirty() && competitionForm.startDatetime().errors().length > 0"
                    [attr.aria-invalid]="competitionForm.startDatetime().dirty() && competitionForm.startDatetime().errors().length > 0"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                />
                </div>

                <div>
                <label for="end-datetime" class="block text-sm font-semibold text-gray-700 mb-1.5">Date de fin</label>
                <input
                    id="end-datetime"
                    type="datetime-local"
                    [formField]="competitionForm.endDatetime"
                    [class.border-red-500]="competitionForm.endDatetime().dirty() && competitionForm.endDatetime().errors().length > 0"
                    [class.bg-red-50]="competitionForm.endDatetime().dirty() && competitionForm.endDatetime().errors().length > 0"
                    [attr.aria-invalid]="competitionForm.endDatetime().dirty() && competitionForm.endDatetime().errors().length > 0"
                    class="w-full px-3.5 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 transition duration-200"
                />
                </div>
            </div>

        </form>
            <!-- Modal footer -->
            <div class="flex items-center border-t border-default space-x-4 pt-4 md:pt-5">
                <button 
                    type="submit"
                    [disabled]="competitionForm().submitting()"
                    data-modal-hide="static-modal" type="button" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
                    Sauvegarder
                </button>
                <button 
                    (click)="closeDialog()"
                    data-modal-hide="static-modal" type="button" class="text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
                    Annuler
                </button>
            </div>
        </div>
    </div>
</div>
