<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
	<section
		class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl"
		role="dialog"
		aria-modal="true"
		aria-labelledby="delete-team-title"
	>
		<h2 id="delete-team-title" class="text-lg font-semibold text-slate-900">Supprimer l’inscription de l’équipe ?</h2>
		<p class="mt-2 text-sm text-slate-600">
			L’association de {{ teamName() }} à cette compétition sera définitivement supprimée.
		</p>

		@if (deleteError()) {
			<p role="alert" class="mt-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
				{{ deleteError() }}
			</p>
		}

		<div class="mt-6 flex justify-end gap-3">
			<button
				type="button"
				class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60"
				[disabled]="deleteLoading()"
				(click)="closeDialog()"
			>
				Annuler
			</button>
			<button
				type="button"
				class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-red-300"
				[disabled]="deleteLoading()"
				(click)="confirmDeletion()"
			>
				{{ deleteLoading() ? 'Suppression…' : 'Supprimer l’inscription' }}
			</button>
		</div>
	</section>
</div>
