
<!-- Main modal -->
<div tabindex="-1" aria-hidden="true" class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-slate-900/40 p-4">
  <div class="relative w-full max-w-2xl max-h-full">
    <div class="relative rounded-xl border border-slate-200 bg-white p-4 shadow-lg md:p-6">
      <div class="flex items-center justify-between border-b border-slate-200 pb-4 md:pb-5">
        <h3 class="text-lg font-semibold text-slate-800">Création de compétition</h3>
        <button
          type="button"
          (click)="onDialogClosed.emit()"
          class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-sm text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
          aria-label="Fermer le modal"
        >
          <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
          </svg>
        </button>
      </div>

      <div class="space-y-4 py-4 md:space-y-6 md:py-6">
        <form [formRoot]="competitionForm" class="space-y-5" novalidate>
          @if (error()) {
            <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
              {{ error() }}
            </div>
          }

          <div>
            <label for="name" class="mb-1.5 block text-sm font-semibold text-gray-700">Nom de la compétition</label>
            <input
              id="name"
              type="text"
              [formField]="competitionForm.name"
              [class.border-red-500]="competitionForm.name().dirty() && competitionForm.name().errors().length > 0"
              [class.bg-red-50]="competitionForm.name().dirty() && competitionForm.name().errors().length > 0"
              [attr.aria-invalid]="competitionForm.name().dirty() && competitionForm.name().errors().length > 0"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              placeholder="Coupe du monde"
            />
            @if (competitionForm.name().dirty()) {
              @for (error of competitionForm.name().errors(); track error) {
                <p class="mt-1 text-xs font-medium text-red-500">{{ error.message }}</p>
              }
            }
          </div>

          <div class="grid gap-5 md:grid-cols-2">
            <div>
              <label for="country" class="mb-1.5 block text-sm font-semibold text-gray-700">Pays</label>
              <select
                id="country"
                [formField]="competitionForm.countryCode"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              >
                <option value="">Choisir un pays</option>
                @for (country of countries; track country.code) {
                  <option [value]="country.code">{{ country.label }}</option>
                }
              </select>
            </div>

            <div>
              <label for="teams-count" class="mb-1.5 block text-sm font-semibold text-gray-700">Nombre d'équipes</label>
              <input
                id="teams-count"
                type="number"
                [formField]="competitionForm.numberOfTeams"
                [class.border-red-500]="competitionForm.numberOfTeams().dirty() && competitionForm.numberOfTeams().errors().length > 0"
                [class.bg-red-50]="competitionForm.numberOfTeams().dirty() && competitionForm.numberOfTeams().errors().length > 0"
                [attr.aria-invalid]="competitionForm.numberOfTeams().dirty() && competitionForm.numberOfTeams().errors().length > 0"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                placeholder="16"
              />
            </div>

            <div>
              <label for="participant-kind" class="mb-1.5 block text-sm font-semibold text-gray-700">Type d'équipes</label>
              <select
                id="participant-kind"
                [formField]="competitionForm.participantKind"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              >
                <option value="">Choisir le type d'équipes</option>
                @for (item of participantKinds; track item.value) {
                  <option [value]="item.value">{{ item.label }}</option>
                }
              </select>
            </div>

            <div>
              <label for="scope" class="mb-1.5 block text-sm font-semibold text-gray-700">Portée de la compétition</label>
              <select
                id="scope"
                [formField]="competitionForm.scope"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              >
                <option value="">Choisir la portée</option>
                @for (item of competitionScopes; track item.value) {
                  <option [value]="item.value">{{ item.label }}</option>
                }
              </select>
            </div>

            <div>
              <label for="type" class="mb-1.5 block text-sm font-semibold text-gray-700">Type de compétition</label>
              <select
                id="type"
                [formField]="competitionForm.type"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              >
                <option value="">Choisir le type</option>
                @for (item of competitionTypes; track item.value) {
                  <option [value]="item.value">{{ item.label }}</option>
                }
              </select>
            </div>

            <div>
              <label for="phase" class="mb-1.5 block text-sm font-semibold text-gray-700">Phase</label>
              <select
                id="phase"
                [formField]="competitionForm.phase"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              >
                <option value="">Aucune</option>
                @for (item of competitionPhases; track item.value) {
                  <option [value]="item.value">{{ item.label }}</option>
                }
              </select>
            </div>

            <div>
              <label for="player-sex" class="mb-1.5 block text-sm font-semibold text-gray-700">Sexe</label>
              <select
                id="player-sex"
                [formField]="competitionForm.playerSex"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              >
                @for (item of playerSexes; track item.value) {
                  <option [value]="item.value">{{ item.label }}</option>
                }
              </select>
            </div>

            <div>
              <label for="start-datetime" class="mb-1.5 block text-sm font-semibold text-gray-700">Date de début</label>
              <input
                id="start-datetime"
                type="datetime-local"
                [formField]="competitionForm.startDatetime"
                [class.border-red-500]="competitionForm.startDatetime().dirty() && competitionForm.startDatetime().errors().length > 0"
                [class.bg-red-50]="competitionForm.startDatetime().dirty() && competitionForm.startDatetime().errors().length > 0"
                [attr.aria-invalid]="competitionForm.startDatetime().dirty() && competitionForm.startDatetime().errors().length > 0"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              />
            </div>

            <div>
              <label for="end-datetime" class="mb-1.5 block text-sm font-semibold text-gray-700">Date de fin</label>
              <input
                id="end-datetime"
                type="datetime-local"
                [formField]="competitionForm.endDatetime"
                [class.border-red-500]="competitionForm.endDatetime().dirty() && competitionForm.endDatetime().errors().length > 0"
                [class.bg-red-50]="competitionForm.endDatetime().dirty() && competitionForm.endDatetime().errors().length > 0"
                [attr.aria-invalid]="competitionForm.endDatetime().dirty() && competitionForm.endDatetime().errors().length > 0"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
              />
            </div>
          </div>
        </form>
      </div>

      <div class="flex items-center justify-end space-x-3 border-t border-slate-200 pt-4 md:pt-5">
        <button
          type="button"
          (click)="onDialogClosed.emit()"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="competitionForm().submitting()"
          class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300"
        >
          Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>
