<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
	<section
		class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl"
		role="dialog"
		aria-modal="true"
		aria-labelledby="goal-cancel-confirmation-title"
	>
		<h2 id="goal-cancel-confirmation-title" class="text-lg font-semibold text-slate-900">
			Annuler ce but ?
		</h2>
		<p class="mt-2 text-sm text-slate-600">
			Le but de {{ scorer() }} sera annulé. Cette action modifiera le score du match.
		</p>

		@if (error()) {
			<p class="mt-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
				{{ error() }}
			</p>
		}

		<div class="mt-6 flex justify-end gap-3">
			<button
				type="button"
				class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60"
				[disabled]="loading()"
				(click)="dismissed.emit()"
			>
				Retour
			</button>
			<button
				type="button"
				class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-red-300"
				[disabled]="loading()"
				(click)="confirmCancellation()"
			>
				{{ loading() ? 'Annulation…' : 'Confirmer l’annulation' }}
			</button>
		</div>
	</section>
</div>
