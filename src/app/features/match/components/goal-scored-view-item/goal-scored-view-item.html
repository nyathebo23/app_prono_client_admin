<article class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3">
	<div class="flex flex-wrap items-center justify-between gap-3">
		<div>
			<p class="font-medium text-slate-800">{{ goal().scorer }}</p>
			<p class="text-sm text-slate-500">
				{{ goal().teamHomeScored ? homeTeamName() : awayTeamName() }}
				• {{ goal().isOwnGoal ? 'but contre son camp' : goal().isPenalty ? 'penalty' : 'but standard' }}
			</p>
		</div>

		<div class="flex items-center gap-3">
			<p class="text-sm font-semibold text-slate-700">{{ goal().minute }}'</p>
			<button
				type="button"
				class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
				(click)="edit.emit(goal())"
			>
				Modifier
			</button>
			<button
				type="button"
				class="rounded-lg border border-red-200 bg-red-50 px-3 py-1.5 text-sm font-medium text-red-700 transition hover:bg-red-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-400"
				[disabled]="matchFinished()"
				[attr.aria-label]="'Annuler le but de ' + goal().scorer"
				(click)="isCancelConfirmationOpen.set(true)"
			>
				Annuler le but
			</button>
		</div>
	</div>

	@if (isCancelConfirmationOpen()) {
		<app-goal-cancel-confirm-dialog
			[goalId]="goal().id"
			[scorer]="goal().scorer"
            [matchId]="goal().matchId"
			(dismissed)="closeCancelConfirmation()"
		/>
	}
</article>
