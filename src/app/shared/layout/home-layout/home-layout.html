<div class="min-h-screen bg-slate-100">
  <div class="flex min-h-screen">
    @if (sidebarOpen()) {
      <aside id="main-sidebar" aria-label="Navigation principale" class="w-72 shrink-0 border-r border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-200 px-5 py-4">
          <h1 class="text-xl font-semibold tracking-tight text-slate-800">Sport Predict</h1>
        </div>

        <nav class="flex flex-col gap-1 p-3">
          @for (navItem of sideNavItems; track navItem.route) {
            <a
              [routerLink]="navItem.route"
              [routerLinkActiveOptions]="{ exact: false }"
              routerLinkActive="!bg-blue-900 !text-white"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
            >
              <span class="flex h-5 w-5 items-center justify-center text-current">
                <ng-container *ngComponentOutlet="navItem.icon" />
              </span>
              {{ navItem.title }}
            </a>
          }
        </nav>
      </aside>
    }

    <main class="min-w-0 flex-1 overflow-auto">
      <header class="sticky top-0 z-30 flex h-14 items-center border-b border-slate-200 bg-white px-4">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
          aria-controls="main-sidebar"
          [attr.aria-expanded]="sidebarOpen()"
          [attr.aria-label]="sidebarOpen() ? 'Masquer le menu de navigation' : 'Afficher le menu de navigation'"
          [title]="sidebarOpen() ? 'Masquer le menu' : 'Afficher le menu'"
          (click)="toggleSidebar()"
        >
          <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <div class="p-6">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
